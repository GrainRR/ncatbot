# 插件来源唯一事实来源。README 与 manifest.toml 的名称、目录和版本必须与本文件一致。
schema_version = 1

[framework]
repository = "https://github.com/ncatbot/NcatBot.git"
branch = "main"
package = "ncatbot5"
minimum_python = "3.12"
# 官方仓库在 2026-07-25 显示的最新发布版本；升级前必须在干净环境复验本插件集。
latest_upstream_version = "5.5.6"
# 本仓库已安装、CLI 已验证且 requirements.txt 锁定的版本。
recommended_version = "5.5.4"

[plugins.message_archive]
repository = "https://github.com/GrainRR/ncatbot-plugin-message_archive.git"
version = "0.1.0"
directory = "message_archive"

[plugins.group_daily_report]
repository = "https://github.com/GrainRR/ncatbot-plugin-group-daily-report.git"
version = "0.1.0"
directory = "group_daily_report"

[plugins.group_forbidden_words]
repository = "https://github.com/GrainRR/ncatbot-plugin-group-forbidden-words.git"
version = "0.1.0"
directory = "group_forbidden_words"

[plugins.group_special_title]
repository = "https://github.com/GrainRR/ncatbot-plugin-group-special-title.git"
version = "0.1.0"
directory = "group_special_title"

[plugins.bilibili_url_parser]
repository = "https://github.com/GrainRR/ncatbot-plugin-bilibili-url-parser.git"
version = "1.0.1"
directory = "bilibili_url_parser"

[plugins.todo_reminder]
repository = "https://github.com/GrainRR/ncatbot-plugin-todo_reminder.git"
version = "0.1.0"
directory = "todo_reminder"
